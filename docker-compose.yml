services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
    volumes:
      - sqlite_data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  sqlite_data:
